<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>עין הרע — הסרה ושמירה</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;700&family=Miriam+Libre:wght@400;700&family=Bellefair&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0c0d1d;
    --ink-2:#15172e;
    --ink-3:#1d2042;
    --gold:#c9a661;
    --gold-2:#e3c98a;
    --gold-deep:#8a6a2a;
    --cream:#f4ecd8;
    --cream-2:#e8dcbe;
    --paper:#f6efde;
    --wine:#7a1a36;
    --wine-2:#a8324f;
    --moss:#3d5945;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Heebo',system-ui,sans-serif;
    background:var(--ink);
    color:var(--cream);
    overflow-x:hidden;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}
  .grain::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(201,166,97,.08) 1px, transparent 1px);
    background-size:24px 24px;
    mix-blend-mode:screen;opacity:.4;
  }
  .scroll-area::-webkit-scrollbar{width:6px}
  .scroll-area::-webkit-scrollbar-thumb{background:var(--gold-deep);border-radius:3px}
  @keyframes spinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes spinSlowR{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  @keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.05)}}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .fade-up{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
  .fade-in{animation:fadeIn .6s ease both}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="tracker.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens/home.jsx"></script>
  <script type="text/babel" src="screens/quiz.jsx"></script>
  <script type="text/babel" src="screens/packages.jsx"></script>
  <script type="text/babel" src="screens/booking.jsx"></script>
  <script type="text/babel" src="screens/confirmation.jsx"></script>
  <script type="text/babel" src="screens/about.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
